# Default H2 configuration for development
spring.datasource.url=jdbc:h2:mem:loop_app;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console - Disable in production
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.whitelabel.enabled=false

# Frontend URL Configuration
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:super-secret-key-change-in-prod-please-use-strong-key-2026-super-long-string}
app.jwt.expiration-ms=28800000

# Logging - Reduce verbosity in production
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# OpenAI API (optional: non-AI reports still work without this key)
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4-mini}

