# Default H2 configuration for development
spring.datasource.url=jdbc:h2:mem:loop_app;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

app.jwt.secret=super-secret-key-change-in-prod-please-use-strong-key-2026-super-long-string
app.jwt.expiration-ms=28800000
logging.level.org.springframework.security=DEBUG

# Anthropic Claude API
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-3-5-sonnet-20241022